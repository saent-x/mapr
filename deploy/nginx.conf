# deploy/nginx.conf — server block for the `web` service (nginx:alpine).
# Mounted at /etc/nginx/conf.d/default.conf (see docker-compose.yml). Serves the
# static Vite/React build with SPA fallback, sane caching and security headers.
#
# The basemap is a bundled static asset (/world.geo.json) — there is NO tile CDN
# or CORS proxy at runtime. The only cross-origin traffic from the browser is to
# the Convex tunnel origin (VITE_CONVEX_URL: https:// queries + wss:// reactive
# socket). Because that origin is a per-deployment tunnel hostname, connect-src
# is left permissive (https:/wss:) rather than hardcoding a host; everything
# else stays locked to 'self'. MapLibre spins up workers from blob: URLs, so
# worker-src/child-src allow blob:.

map $sent_http_content_type $cache_control {
    default                   "no-cache";
    ~*application/javascript  "public, max-age=31536000, immutable";
    ~*text/css                "public, max-age=31536000, immutable";
    ~*image/                  "public, max-age=2592000";
    ~*font/                   "public, max-age=31536000, immutable";
}

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compression.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/geo+json application/manifest+json;

    # Security headers (applied to every response).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https: wss:" always;

    # Bundled basemap (largeish JSON) — cache for a day; correct content type.
    location = /world.geo.json {
        default_type application/geo+json;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Hashed build assets: long-lived immutable cache (content-addressed names).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker must never be cached stale.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA fallback: serve index.html for any unmatched client route.
    location / {
        add_header Cache-Control $cache_control always;
        try_files $uri $uri/ /index.html;
    }

    # Don't log noise for favicon/robots.
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
