<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAPR</title>
<meta name="color-scheme" content="light">
<link rel="preload" href="/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/desk.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="stage">
  <section class="map" id="map" aria-label="Map"></section>

  <header class="top">
    <div class="top-left">
      <button class="icon-btn" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
        <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 4h10M2 7h10M2 10h10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
      <span class="mark">MAPR</span>
    </div>
    <div class="status num" role="status">
      <span class="live" id="link">OFFLINE</span>
      <span class="sep"></span>
      <time id="clock"></time>
      <span class="sep"></span>
      <span class="stat"><b id="n-events">0</b> <span>events 24h</span></span>
      <span class="stat"><b id="n-sources">0</b> <span>sources</span></span>
      <span class="stat"><b id="n-countries">0</b> <span>countries</span></span>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Map view">
        <button type="button" data-proj="mercator">Flat</button>
        <button type="button" data-proj="globe">Globe</button>
      </div>
      <button class="avatar" id="acct-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false" aria-controls="acct">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c.8-2.8 3-4 5.5-4s4.7 1.2 5.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="pop pop-left" id="menu" aria-label="Pages" hidden>
    <a href="/" aria-current="page"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12" stroke="currentColor" stroke-width="1.1"/></svg>Map</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2 8s2.5-4.5 6-4.5S14 8 14 8s-2.5 4.5-6 4.5S2 8 2 8z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.3"/></svg>Watchlists</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 11V7a4 4 0 018 0v4l1 1.5H3L4 11zM6.5 14h3" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>Alerts</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 2h6l3 3v9H4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.5 8.5h4M6.5 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Reports</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Sources</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 4.5V8l2.5 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/></svg>History</a>
  </nav>

  <nav class="pop pop-right" id="acct" aria-label="Account" hidden>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="5.5" r="2.8" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c.8-2.8 3-4 5.5-4s4.7 1.2 5.5 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Account settings</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.8" y="3.5" width="12.4" height="9" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 6.5h12.4" stroke="currentColor" stroke-width="1.3"/></svg>Billing</a>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M3.8 12.2l1.4-1.4M10.8 5.2l1.4-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.3"/></svg>Preferences</a>
    <hr>
    <a aria-disabled="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6.5 2.5H3.5v11h3M10 5l3 3-3 3M13 8H6.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Sign out</a>
  </nav>

  <section class="card panel" id="panel" aria-live="polite" hidden></section>

  <section class="card feed" aria-label="Live feed">
    <button class="card-head num" id="feed-head" type="button" aria-expanded="false" aria-controls="feed"><span>LIVE FEED <b class="feed-n" id="feed-n"></b></span><span class="accent" id="rate"></span></button>
    <div class="feed-list" id="feed" role="listbox" aria-label="Events" tabindex="0"></div>
  </section>

  <section class="card chart" aria-label="Activity, last 24 hours">
    <div class="chart-head"><span><b class="chart-total" id="chart-total">0</b> <span class="accent num" id="chart-delta"></span></span><span class="num muted">24H</span></div>
    <div class="bars" id="bars"></div>
    <div class="axis num" id="axis"></div>
  </section>

  <div class="dock">
    <div class="pills" id="pills"></div>
    <form class="ask" id="ask" role="search">
      <label class="sr" for="q">Ask the map</label>
      <input id="q" name="q" type="text" autocomplete="off" spellcheck="false" enterkeyhint="search">
      <button class="mic" id="mic" type="button" aria-label="Dictate" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8.5" rx="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M3 7.5a5 5 0 0010 0M8 12.5v2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>
    </form>
  </div>

  <div class="legend num" aria-hidden="true"><span class="muted">Low</span><i></i><span>High</span></div>
  <div class="zoom">
    <button type="button" id="zoom-in" aria-label="Zoom in"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    <button type="button" id="zoom-out" aria-label="Zoom out"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 6h9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
  </div>

  <div class="card hovercard" id="hover" hidden></div>
</div>
</body>
</html>
