<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mapr</title>
<meta name="color-scheme" content="light dark">
<link rel="preload" href="/fonts/geist-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/geist-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/atlas.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="desk">
  <nav class="m-nav">
    <div class="m-nav__l">
      <span class="m-word">mapr</span>
      <button class="m-status m-link--off" id="status" type="button" style="all:unset;cursor:pointer" aria-label="Live feed">
        <span class="m-status"><span class="m-live m-live--off" id="live" role="img" aria-label="Offline"></span><strong id="link">Offline</strong><span>— <span data-n id="n-sources">0</span> sources · <span data-n id="n-events">0</span> events 24h · <span class="m-num" id="clock"></span></span></span>
      </button>
    </div>
    <div class="m-nav__r">
      <span class="m-views" id="views"><button class="m-link" type="button" data-view="globe">Globe</button><span class="m-slash">/</span><button class="m-link m-link--off" type="button" data-view="flat">Flat</button></span>
      <button class="m-btn m-btn--icon" id="menu-btn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12M2 8h12M2 11.5h12"/></svg></button>
      <button class="m-avatar" id="acct-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false" aria-controls="acct"><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 14c.8-2.6 2.7-3.8 5-3.8s4.2 1.2 5 3.8"/></svg></button>
    </div>
  </nav>

  <ul class="m-menu d-menu is-right" id="menu" role="menu" aria-label="Pages" hidden style="right:60px">
    <li role="menuitem" aria-current="page">Map</li>
    <li role="menuitem" aria-disabled="true">Watchlists</li>
    <li role="menuitem" aria-disabled="true">Alerts</li>
    <li role="menuitem" aria-disabled="true">Reports</li>
    <li role="menuitem" aria-disabled="true">Sources</li>
  </ul>
  <ul class="m-menu d-menu is-right" id="acct" role="menu" aria-label="Account" hidden>
    <li role="menuitem" id="theme-item" tabindex="0">Night <kbd id="theme-state">Off</kbd></li>
    <hr>
    <li role="menuitem" aria-disabled="true">Account settings</li>
    <li role="menuitem" aria-disabled="true">Billing</li>
    <li role="menuitem" aria-disabled="true">Sign out</li>
  </ul>

  <main class="d-stage" id="stage">
    <div class="d-map" id="map" aria-label="Map"></div>
    <div class="d-strip"><button class="m-status" id="strip-live" type="button" style="all:unset;cursor:pointer"><span class="m-status"><strong id="strip-link">Offline</strong><span>— <span data-n id="n-today">0</span> today</span></span></button><span class="m-views"><button class="m-link" type="button" data-view="globe">Globe</button><span class="m-slash">/</span><button class="m-link m-link--off" type="button" data-view="flat">Flat</button></span></div>

    <section class="d-left is-feed" id="feed-box" aria-label="Live feed">
      <div class="d-sheethead"><span class="m-status"><span class="m-live"></span><strong>Live</strong></span><button class="m-link m-link--off" type="button" data-close-sheet style="font-size:12px">Close</button></div>
      <div class="m-feed__time m-num" id="feed-time"></div>
      <ol class="m-feed" id="feed" style="margin-top:10px" aria-label="Events"></ol>
    </section>
    <section class="d-left is-answer" id="answer" aria-live="polite" hidden></section>
    <div class="d-hudwrap" id="hud" hidden></div>

    <aside class="d-right is-layers" id="layers">
      <div class="m-panel" id="panel">
        <div class="m-panel__head"><h3>Layers</h3><button class="m-link m-link--off" type="button" id="panel-toggle" style="font-size:12px">Hide</button></div>
        <div class="m-panel__sec"><span>Category</span><div class="m-seg" id="f-cat"></div></div>
        <div class="m-panel__sec"><span>Map</span><div class="m-seg" id="f-layers">
          <button class="m-chip" type="button" data-layer="events" aria-pressed="true">Events</button>
          <button class="m-chip" type="button" data-layer="density" aria-pressed="true">Density</button>
          <button class="m-chip" type="button" data-layer="flows" aria-pressed="true">Sources</button>
          <button class="m-chip" type="button" data-layer="night" aria-pressed="true">Night</button>
          <button class="m-chip" type="button" data-layer="labels" aria-pressed="true">Labels</button>
        </div></div>
        <div class="m-panel__sec"><span>Severity</span><div class="m-seg m-seg--fill" id="f-sev">
          <button class="m-chip" type="button" data-sev="0" aria-pressed="true">All</button>
          <button class="m-chip" type="button" data-sev="3" aria-pressed="false">High+</button>
          <button class="m-chip" type="button" data-sev="4" aria-pressed="false">Critical</button>
        </div></div>
        <div class="m-panel__sec"><span>Window</span><div class="m-seg m-seg--fill" id="f-win">
          <button class="m-chip" type="button" data-hours="1" aria-pressed="false">1h</button>
          <button class="m-chip" type="button" data-hours="6" aria-pressed="false">6h</button>
          <button class="m-chip" type="button" data-hours="24" aria-pressed="true">24h</button>
        </div></div>
        <div class="m-panel__sec"><span>Camera</span><div class="m-seg m-seg--fill" id="f-cam">
          <button class="m-chip" type="button" data-cam="free" aria-pressed="true">Free</button>
          <button class="m-chip" type="button" data-cam="follow" aria-pressed="false">Follow new</button>
        </div></div>
      </div>
    </aside>
    <aside class="d-right is-detail" id="detail" hidden></aside>

    <section class="d-chart" aria-label="Events per hour">
      <div class="m-chart">
        <div class="m-chart__head"><h4>Events per hour</h4><span class="m-readout"><b class="m-num" id="chart-total">0</b> · <span id="chart-win">24h</span></span></div>
        <svg id="chart" viewBox="0 0 288 96" role="img" aria-label="Events per hour, last 24 hours"></svg>
      </div>
    </section>

    <div class="d-chat">
      <form class="m-chat" id="ask" role="search">
        <span class="m-chat__scope" id="scope" hidden></span>
        <input id="q" name="q" type="text" placeholder="Ask the map" aria-label="Ask the map" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="m-chat__mic" id="mic" aria-label="Speak" hidden><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3 7.5a5 5 0 0 0 10 0M8 12.5v2"/></svg></button>
        <button type="submit" class="m-chat__send" id="send" aria-label="Ask" disabled><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
      </form>
    </div>

    <div class="d-legend" aria-hidden="true">
      <div><svg width="22" height="22"><path class="spk" d="M11 20V5"/><circle class="spk-c" cx="11" cy="5" r="2.6"/></svg><span>sources</span></div>
      <div><svg width="22" height="22"><path class="spk crit" d="M11 20V9"/><circle class="spk-c crit" cx="11" cy="9" r="2.6"/></svg><span>critical</span></div>
      <div><svg width="22" height="22"><circle class="den" cx="11" cy="11" r="8"/><circle class="den" cx="11" cy="11" r="4"/></svg><span>density</span></div>
      <div><svg width="26" height="22"><path class="flw" d="M2 18Q13 0 24 18"/></svg><span>reported from</span></div>
      <div><svg width="22" height="22"><circle class="nit" cx="11" cy="11" r="8"/><path class="nit2" d="M11 3a8 8 0 0 1 0 16Z"/></svg><span>night</span></div>
    </div>
    <div class="d-zoom">
      <button class="m-btn m-btn--icon" type="button" id="zoom-in" aria-label="Zoom in"><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M8 3v10"/></svg></button>
      <button class="m-btn m-btn--icon" type="button" id="zoom-out" aria-label="Zoom out"><svg class="m-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10"/></svg></button>
    </div>
  </main>
</div>
</body>
</html>
